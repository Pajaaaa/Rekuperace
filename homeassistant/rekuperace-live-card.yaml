          color: '#fde68a'
          font-size: clamp(11px,1.25vw,15px)
          font-weight: 700
          background: rgba(3,18,27,0.88)
          border: 1px solid '#fbbf24'
          border-radius: 12px
          padding: 7px 12px
      - type: state-label
        entity: number.rekuperace_privod_stupen
        prefix: 'Přívod '
        tap_action:
          action: more-info
        style:
          left: 42%
          top: 39%
          color: '#a5f3fc'
          font-size: clamp(11px,1.2vw,15px)
          font-weight: 700
          background: rgba(3,18,27,0.9)
          border-radius: 8px
          padding: 6px 8px
      - type: state-label
        entity: number.rekuperace_odtah_stupen
        prefix: 'Odtah '
        tap_action:
          action: more-info
        style:
          left: 58%
          top: 59%
          color: '#fed7aa'
          font-size: clamp(11px,1.2vw,15px)
          font-weight: 700
          background: rgba(3,18,27,0.9)
          border-radius: 8px
          padding: 6px 8px
      - type: state-label
        entity: select.rekuperace_bypass_klapka
        prefix: 'Bypass: '
        tap_action:
          action: more-info
        style:
          left: 50%
          top: 27%
          color: '#ddd6fe'
          font-size: clamp(8px,1.1vw,14px)
          font-weight: 700
          background: rgba(46,31,74,0.9)
          border: 1px solid '#a78bfa'
          border-radius: 8px
          padding: 6px 8px
      - type: state-icon
        entity: binary_sensor.rekuperace_odmrazovani
        title: Odmrazování
        tap_action:
          action: more-info
        style:
          left: 50%
          top: 70%
          color: '#93c5fd'
          '--mdc-icon-size': 27px
          background: rgba(3,18,27,0.88)
          border-radius: 50%
          padding: 8px
  - type: grid
    columns: 3
    square: false
    cards:
      - type: entities
        title: Provoz a ventilátory
        show_header_toggle: false
        state_color: true
        entities:
          - entity: switch.rekuperace_zapnuto
            name: Rekuperace zapnuta
          - entity: select.rekuperace_rezim
            name: Režim
          - entity: number.rekuperace_privod_stupen
            name: Přívodní ventilátor
          - entity: number.rekuperace_odtah_stupen
            name: Odtahový ventilátor
          - entity: switch.rekuperace_boost
            name: Boost
          - entity: switch.rekuperace_fan_separation
            name: Oddělené řízení ventilátorů
      - type: entities
        title: Klapky a teplotní funkce
        show_header_toggle: false
        state_color: true
        entities:
          - entity: select.rekuperace_bypass_klapka
            name: Bypass klapka
          - entity: select.rekuperace_bypass_automatika
            name: Automatika bypassu
          - entity: select.rekuperace_externi_klapka
            name: Externí klapka
          - entity: switch.rekuperace_predehrev_preheat
            name: Předehřev
          - entity: switch.rekuperace_dohrev_postheat
            name: Dohřev
          - entity: switch.rekuperace_free_cooling
            name: Free cooling
          - entity: binary_sensor.rekuperace_odmrazovani
            name: Odmrazování
      - type: entities
        title: Filtry a servis
        show_header_toggle: false
        entities:
          - entity: sensor.rekuperace_g_filtr_hodiny
            name: G filtr — provozní hodiny
          - entity: sensor.rekuperace_f_filtr_hodiny
            name: F filtr — provozní hodiny
          - entity: sensor.rekuperace_h_filtr_hodiny
            name: H filtr — provozní hodiny
          - entity: button.rekuperace_reset_g_filtru
            name: Reset G filtru
          - entity: button.rekuperace_reset_f_filtru
            name: Reset F filtru
          - entity: button.rekuperace_reset_h_filtru
            name: Reset H filtru
  - type: grid
    columns: 2
    square: false
    cards:
      - type: history-graph
        title: Teploty a vlhkost — 24 hodin
        hours_to_show: 24
        entities:
          - entity: sensor.rekuperace_teplota_odtah_interier
            name: Interiér
          - entity: sensor.rekuperace_venkovni_teplota
            name: Venkovní vzduch
          - entity: sensor.rekuperace_teplota_vyfuk_ven
            name: Výfuk
          - entity: sensor.rekuperace_vlhkost_odtah_interier
            name: Vlhkost
      - type: history-graph
        title: Kvalita vzduchu — 24 hodin
        hours_to_show: 24
        entities:
          - entity: sensor.rekuperace_co2
            name: CO₂
          - entity: sensor.rekuperace_pm2_5
            name: PM2.5
          - entity: sensor.rekuperace_voc_uroven
            name: VOC
