type: vertical-stack
cards:
  - type: markdown
    content: |-
      ## 🌬️ Živé schéma rekuperace
      Modrá větev přivádí čerstvý vzduch do domu, oranžová odvádí použitý vzduch ven. Hodnoty a ikony v obrázku jsou živé a klikatelné.
  - type: picture-elements
    image: data:image/svg+xml;base64,
    dark_mode_image: data:image/svg+xml;base64,
    elements:
      - type: state-icon
        entity: switch.rekuperace_zapnuto
        title: Zapnout nebo vypnout rekuperaci
        tap_action:
          action: toggle
        style:
          left: 46.800000000000004%
          top: 7%
          color: '#22d3ee'
          '--mdc-icon-size': 30px
          background: rgba(5,20,30,0.88)
          border: 1px solid rgba(103,232,249,0.65)
          border-radius: 50%
          padding: 8px
      - type: state-icon
        entity: switch.rekuperace_boost
        title: Boost
        tap_action:
          action: toggle
        style:
          left: 53.2%
          top: 7%
          color: '#fbbf24'
          '--mdc-icon-size': 30px
          background: rgba(5,20,30,0.88)
          border: 1px solid rgba(251,191,36,0.65)
          border-radius: 50%
          padding: 8px
      - type: state-label
        entity: select.rekuperace_rezim
        prefix: 'Režim: '
        tap_action:
          action: more-info
        style:
          left: 50%
          top: 16%
          color: white
          font-size: clamp(12px,1.35vw,16px)
          font-weight: 700
          background: rgba(3,18,27,0.9)
          border: 1px solid '#55798b'
          border-radius: 12px
          padding: 8px 14px
      - type: state-label
        entity: sensor.rekuperace_venkovni_teplota
        prefix: 'Venku '
        tap_action:
          action: more-info
        style:
          left: 18.8%
          top: 28%
          color: '#bae6fd'
          font-size: clamp(12px,1.4vw,14px)
          font-weight: 700
          background: rgba(3,18,27,0.88)
          border: 1px solid '#38bdf8'
          border-radius: 12px
          padding: 8px 13px
      - type: state-label
        entity: sensor.rekuperace_teplota_odtah_interier
        prefix: 'Interiér '
        tap_action:
          action: more-info
        style:
          left: 81.2%
          top: 28%
          color: '#fed7aa'
          font-size: clamp(12px,1.4vw,14px)
          font-weight: 700
          background: rgba(3,18,27,0.88)
          border: 1px solid '#fb923c'
          border-radius: 12px
          padding: 8px 13px
      - type: state-label
        entity: sensor.rekuperace_teplota_vyfuk_ven
        prefix: 'Výfuk '
        tap_action:
          action: more-info
        style:
          left: 18.8%
          top: 70%
          color: '#fed7aa'
          font-size: clamp(12px,1.4vw,14px)
          font-weight: 700
          background: rgba(3,18,27,0.88)
          border: 1px solid '#fb923c'
          border-radius: 12px
          padding: 8px 13px
      - type: state-label
        entity: sensor.rekuperace_vlhkost_odtah_interier
        prefix: 'Vlhkost '
        tap_action:
          action: more-info
        style:
          left: 81.2%
          top: 60%
          color: '#a5f3fc'
          font-size: clamp(11px,1.25vw,15px)
          font-weight: 700
          background: rgba(3,18,27,0.88)
          border: 1px solid '#22d3ee'
          border-radius: 12px
          padding: 7px 12px
      - type: state-label
        entity: sensor.rekuperace_co2
        prefix: 'CO₂ '
        tap_action:
          action: more-info
        style:
          left: 81.2%
          top: 69%
          color: '#bbf7d0'
          font-size: clamp(11px,1.25vw,15px)
          font-weight: 700
          background: rgba(3,18,27,0.88)
          border: 1px solid '#4ade80'
          border-radius: 12px
          padding: 7px 12px
      - type: state-label
        entity: sensor.rekuperace_pm2_5
        prefix: 'PM2.5 '
        tap_action:
          action: more-info
        style:
          left: 81.2%
          top: 78%
          color: '#ddd6fe'
          font-size: clamp(11px,1.25vw,15px)
          font-weight: 700
          background: rgba(3,18,27,0.88)
          border: 1px solid '#a78bfa'
          border-radius: 12px
          padding: 7px 12px
      - type: state-label
        entity: sensor.rekuperace_voc_uroven
        prefix: 'VOC '
